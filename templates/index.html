<!DOCTYPE html>
<html>
<head>
    <title>Battery Thermal Monitoring</title>
</head>
<body>

    <h1>Battery Thermal Monitoring</h1>

    <form method="POST">

        <label>Temperature:</label>
        <input type="number" step="any" name="temperature" required>
        <br><br>

        <label>Voltage:</label>
        <input type="number" step="any" name="voltage" required>
        <br><br>

        <label>Current:</label>
        <input type="number" step="any" name="current" required>
        <br><br>

        <label>Coolant Flow Rate:</label>
        <input type="number" step="any" name="coolant_flow" required>
        <br><br>

        <button type="submit">Predict</button>

    </form>

    {% if prediction %}
        <h2>Prediction: {{ prediction }}</h2>
    {% endif %}

</body>
</html>
